<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pending</title>
</head>
<body>
<script>
// Scheduling-policy benchmark (tranche D). Compares four dispatch policies over
// a real pool of dedicated Web Workers, in whatever engine loads this page.
// Plain JavaScript, no Dart: the policies are measured on their own, not
// through DWI's internals, so nothing here is public API.
//
// Workload: a burst of 200 tasks, each a synchronous busy loop of 2, 10 or 50
// ms (70/25/5 %), drawn from a seeded PRNG so every engine sees the same list.
// Tasks with 2 ms cost carry priority 1 (interactive); the rest carry 0.
// Metrics per run: makespan (last completion) and p50/p95 of completion time,
// measured from the moment the burst is submitted.

const WORKERS = 4;
const TASKS = 200;
const REPS = 5;
const POLICIES = ['fifo', 'least-loaded', 'round-robin', 'priority'];

const WORKER_SOURCE = `
self.onmessage = (e) => {
  const end = performance.now() + e.data.ms;
  while (performance.now() < end) {}
  self.postMessage(e.data.id);
};`;
const WORKER_URL = URL.createObjectURL(
  new Blob([WORKER_SOURCE], { type: 'text/javascript' }),
);

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildTasks() {
  const rand = mulberry32(42);
  const tasks = [];
  for (let id = 0; id < TASKS; id++) {
    const r = rand();
    const ms = r < 0.7 ? 2 : r < 0.95 ? 10 : 50;
    tasks.push({ id, ms, priority: ms === 2 ? 1 : 0 });
  }
  return tasks;
}

function percentile(sorted, p) {
  const index = Math.min(sorted.length - 1, Math.ceil(p * sorted.length) - 1);
  return sorted[Math.max(0, index)];
}

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const middle = sorted.length >> 1;
  return sorted.length % 2
    ? sorted[middle]
    : (sorted[middle - 1] + sorted[middle]) / 2;
}

// Runs one burst under [policy] on a fresh pool. Resolves with the makespan
// and the completion-time percentiles, all in milliseconds.
function runPolicy(policy, tasks) {
  return new Promise((resolve, reject) => {
    const workers = [];
    const busy = new Array(WORKERS).fill(false);
    const local = Array.from({ length: WORKERS }, () => []); // push queues
    const shared = []; // pull queue (fifo, priority)
    const completions = [];
    let done = 0;
    let t0 = 0;

    function start(i, task) {
      busy[i] = true;
      workers[i].postMessage({ id: task.id, ms: task.ms });
    }

    function pullFor(i) {
      if (busy[i] || shared.length === 0) return;
      let index = 0;
      if (policy === 'priority') {
        for (let k = 1; k < shared.length; k++) {
          if (shared[k].priority > shared[index].priority) index = k;
        }
      }
      start(i, shared.splice(index, 1)[0]);
    }

    function pushNext(i) {
      if (busy[i] || local[i].length === 0) return;
      start(i, local[i].shift());
    }

    function finish() {
      workers.forEach((w) => w.terminate());
      const sorted = completions.slice().sort((a, b) => a - b);
      resolve({
        makespanMs: sorted[sorted.length - 1],
        p50Ms: percentile(sorted, 0.5),
        p95Ms: percentile(sorted, 0.95),
      });
    }

    for (let i = 0; i < WORKERS; i++) {
      const worker = new Worker(WORKER_URL);
      worker.onerror = (e) => {
        workers.forEach((w) => w.terminate());
        reject(new Error(`worker ${i} failed: ${e.message || 'unknown'}`));
      };
      worker.onmessage = () => {
        busy[i] = false;
        completions.push(performance.now() - t0);
        done++;
        if (done === tasks.length) return finish();
        if (policy === 'fifo' || policy === 'priority') pullFor(i);
        else pushNext(i);
      };
      workers.push(worker);
    }

    t0 = performance.now();
    if (policy === 'fifo' || policy === 'priority') {
      shared.push(...tasks);
      for (let i = 0; i < WORKERS; i++) pullFor(i);
    } else if (policy === 'round-robin') {
      tasks.forEach((task, k) => local[k % WORKERS].push(task));
      for (let i = 0; i < WORKERS; i++) pushNext(i);
    } else if (policy === 'least-loaded') {
      // Each task goes to the worker with the fewest outstanding tasks at the
      // moment it is submitted (queued plus running; ties go to the lowest index).
      for (const task of tasks) {
        let target = 0;
        for (let i = 1; i < WORKERS; i++) {
          const load = (q) => local[q].length + (busy[q] ? 1 : 0);
          if (load(i) < load(target)) target = i;
        }
        local[target].push(task);
      }
      for (let i = 0; i < WORKERS; i++) pushNext(i);
    } else {
      reject(new Error(`unknown policy ${policy}`));
    }
  });
}

async function main() {
  const result = {
    userAgent: navigator.userAgent,
    hardwareConcurrency: navigator.hardwareConcurrency,
    workers: WORKERS,
    tasks: TASKS,
    reps: REPS,
    workload: 'burst of 200 busy-loop tasks, 2/10/50 ms at 70/25/5 %, seed 42',
    arrival: 'all tasks submitted at t0',
    policies: {},
  };
  try {
    const tasks = buildTasks();
    // Warm-up: one unmeasured run per policy, so the first measured run does
    // not pay engine start-up costs.
    for (const policy of POLICIES) await runPolicy(policy, tasks);

    const samples = Object.fromEntries(POLICIES.map((p) => [p, []]));
    for (let rep = 0; rep < REPS; rep++) {
      // Rotate the order each repetition so no policy always runs first.
      for (let k = 0; k < POLICIES.length; k++) {
        const policy = POLICIES[(rep + k) % POLICIES.length];
        samples[policy].push(await runPolicy(policy, tasks));
      }
    }
    for (const policy of POLICIES) {
      const runs = samples[policy];
      result.policies[policy] = {
        makespanMedianMs: median(runs.map((r) => r.makespanMs)),
        p50MedianMs: median(runs.map((r) => r.p50Ms)),
        p95MedianMs: median(runs.map((r) => r.p95Ms)),
        samples: runs,
      };
    }
    result.ok = true;
  } catch (error) {
    result.ok = false;
    result.error = String(error && error.message ? error.message : error);
  }
  document.title = btoa(JSON.stringify(result));
}

main();
</script>
</body>
</html>
